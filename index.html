<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>A Little Universe Called Fara</title>
  <meta name="description" content="Happy Birthday, Fara.">
  <meta name="robots" content="noindex, nofollow">
  <meta name="theme-color" content="#0a0e22">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%230a0e22'/%3E%3Cpath d='M16 7l2.2 6.8L25 16l-6.8 2.2L16 25l-2.2-6.8L7 16l6.8-2.2z' fill='%23d8bd85'/%3E%3C/svg%3E">
  <link rel="preload" href="assets/fonts/cormorant-garamond.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="preload" href="assets/fonts/cormorant-garamond-italic.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="assets/fonts/fonts.css">
  <link rel="stylesheet" href="css/style.css">
</head>
<body class="is-locked">
  <div class="grain" aria-hidden="true"></div>
  <div class="progress" aria-hidden="true"><span></span></div>

  <!-- ============ OPENING ============ -->
  <section class="intro" id="intro" aria-label="Opening">
    <canvas class="intro__sky" aria-hidden="true"></canvas>
    <div class="intro__vignette" aria-hidden="true"></div>
    <div class="intro__text" aria-live="polite">
      <p class="intro__line" data-line="0"></p>
      <p class="intro__line" data-line="1"></p>
      <h1 class="intro__reveal"></h1>
      <button class="intro__enter" type="button">
        <span class="intro__enter-label"></span>
        <span class="intro__enter-arrow" aria-hidden="true">→</span>
      </button>
    </div>
    <button class="intro__skip" type="button">Skip intro</button>
  </section>

  <main id="main" aria-hidden="true">
    <!-- HERO -->
    <header class="hero" id="hero"></header>

    <!-- I. GALLERY -->
    <section class="gallery" id="gallery" aria-labelledby="gallery-title"></section>

    <!-- II. TRAITS -->
    <section class="traits" id="traits" aria-labelledby="traits-title"></section>

    <!-- III. TIMELINE -->
    <section class="timeline" id="timeline" aria-labelledby="timeline-title"></section>

    <!-- IV. REVEAL -->
    <section class="reveal" id="reveal" aria-labelledby="reveal-title"></section>

    <!-- V. CONSTELLATION -->
    <section class="constellation" id="constellation" aria-labelledby="constellation-title"></section>

    <!-- VI. CAKE -->
    <section class="cake" id="cake" aria-labelledby="cake-title"></section>

    <!-- VII. LETTER -->
    <section class="letter" id="letter" aria-label="A letter"></section>

    <!-- VIII. FINALE -->
    <section class="finale" id="finale" aria-label="Happy birthday"></section>
    <footer class="nightfall" id="nightfall"></footer>
  </main>

  <!-- Full-screen viewer -->
  <dialog class="viewer" id="viewer" aria-label="Photo viewer">
    <figure class="viewer__figure">
      <img class="viewer__img" alt="">
      <figcaption class="viewer__caption"></figcaption>
    </figure>
    <button class="viewer__btn viewer__close" type="button" aria-label="Close">×</button>
    <button class="viewer__btn viewer__prev" type="button" aria-label="Previous photo">←</button>
    <button class="viewer__btn viewer__next" type="button" aria-label="Next photo">→</button>
    <p class="viewer__count" aria-live="polite"></p>
  </dialog>

  <button class="music" type="button" hidden aria-pressed="false" aria-label="Play music">
    <span class="music__bars" aria-hidden="true"><i></i><i></i><i></i></span>
  </button>

  <script src="js/config.js"></script>
  <script src="js/main.js"></script>
</body>
</html>
